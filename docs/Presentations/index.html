<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>演示 · Linux 操作系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #12141a;
      --ink-soft: #3d4450;
      --muted: #7a8290;
      --line: #d8dde6;
      --line-strong: #0d9488;
      --paper: #f3f4f6;
      --surface: #ffffff;
      --accent: #0d9488;
      --accent-deep: #0f766e;
      --glow: rgba(13, 148, 136, 0.12);
      --font: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 8% -10%, rgba(13, 148, 136, 0.08), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(15, 23, 42, 0.04), transparent 50%),
        linear-gradient(180deg, #f7f8fa 0%, var(--paper) 48%, #eef0f3 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .demos-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(28px, 5vh, 56px) clamp(20px, 4vw, 32px) 56px;
    }

    .demos-header {
      position: relative;
      padding-bottom: 18px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--line);
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .demos-header::before {
      content: "";
      display: block;
      width: 36px;
      height: 3px;
      background: var(--accent);
      margin-bottom: 18px;
      border-radius: 1px;
    }

    .demos-header h1 {
      font-size: clamp(34px, 5vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink);
    }

    .demos-list {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      display: grid;
      gap: 0;
    }

    .demos-list li {
      border-bottom: 1px solid var(--line);
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.08s;
    }

    .demos-list a {
      display: grid;
      grid-template-columns: 3.2rem 1fr 22px;
      align-items: center;
      gap: 1rem;
      padding: 14px 14px 14px 4px;
      text-decoration: none !important;
      color: inherit;
      position: relative;
      transition: background 0.2s ease, padding-left 0.2s ease;
    }

    .demos-list a::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    .demos-list a:hover,
    .demos-list a:focus-visible {
      background: rgba(255, 255, 255, 0.72);
      padding-left: 12px;
      outline: none;
    }

    .demos-list a:hover::before,
    .demos-list a:focus-visible::before {
      width: 3px;
    }

    .demos-list a:focus-visible {
      box-shadow: inset 0 0 0 2px var(--glow);
    }

    .pl-idx {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--muted);
      transition: color 0.2s ease;
    }

    .demos-list a:hover .pl-idx,
    .demos-list a:focus-visible .pl-idx {
      color: var(--accent-deep);
    }

    .pl-tit {
      font-size: clamp(16px, 2.2vw, 18px);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.35;
    }

    .pl-meta {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      justify-self: end;
    }

    .pl-arrow {
      width: 18px;
      height: 18px;
      margin-left: 4px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      color: var(--accent-deep);
      flex-shrink: 0;
    }

    .demos-list a:hover .pl-arrow,
    .demos-list a:focus-visible .pl-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .demos-list a {
        grid-template-columns: 2.6rem 1fr;
        grid-template-rows: auto auto;
        gap: 6px 12px;
        padding: 18px 8px 18px 2px;
      }
      .pl-meta {
        grid-column: 2;
        justify-self: start;
      }
      .pl-arrow { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .demos-header,
      .demos-list li,
      .demos-list a,
      .pl-arrow,
      .pl-idx {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="demos-shell">
    <header class="demos-header">
      <h1>演示</h1>
    </header>
    <ul class="demos-list">
      <li>
        <a href="01-first-linux.html">

          <span class="pl-meta">17 页</span>
          <svg class="pl-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="02-file-dir.html">
          <span class="pl-idx">02</span>
          <span class="pl-tit">文件与目录管理</span>
          <span class="pl-meta">17 页</span>
          <svg class="pl-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="03-view-find.html">
          <span class="pl-idx">03</span>
          <span class="pl-tit">文本查看和查找</span>
          <span class="pl-meta">21 页</span>
          <svg class="pl-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="04-permission.html">
          <span class="pl-idx">04</span>
          <span class="pl-tit">用户、用户组与权限</span>
          <span class="pl-meta">21 页</span>
          <svg class="pl-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="05-text-search.html">
          <span class="pl-idx">05</span>
          <span class="pl-tit">文本搜索与统计</span>
          <span class="pl-meta">30 页</span>
          <svg class="pl-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="06-text-sort.html">
          <span class="pl-idx">06</span>
          <span class="pl-tit">文本排序与去重</span>
          <span class="pl-meta">24 页</span>
          <svg class="pl-arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 10h11M10 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
